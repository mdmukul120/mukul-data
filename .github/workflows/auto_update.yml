name: 5-Min Auto Link Updater

on:
  schedule:
    # প্রতি ৫ মিনিট পরপর রান হবে (GitHub Actions-এর সর্বনিম্ন লিমিট)
    - cron: '*/5 * * * *'
  workflow_dispatch: # ম্যানুয়ালি "Run workflow" চাপার জন্য

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push Updated Links
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add links.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: Links refreshed [skip ci]" && git push)
